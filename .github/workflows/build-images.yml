name: Online Boutique CI - Build and Push Images
on:
 push:
 branches:
 - main
 workflow_dispatch:
permissions:
 contents: read
 packages: write
jobs:
 build-and-push:
 name: Build ${{ matrix.service }}
 runs-on: ubuntu-latest
 strategy:
 fail-fast: false
 matrix:
 include:
 - service: emailservice
 context: src/emailservice
 - service: productcatalogservice
 context: src/productcatalogservice
 - service: recommendationservice
 context: src/recommendationservice
 - service: shoppingassistantservice
 context: src/shoppingassistantservice
 - service: shippingservice
 context: src/shippingservice
 - service: checkoutservice
 context: src/checkoutservice
 - service: paymentservice
 context: src/paymentservice
 - service: currencyservice
 context: src/currencyservice
 - service: cartservice
 context: src/cartservice/src
 - service: frontend
 context: src/frontend
 - service: adservice
 context: src/adservice
 - service: loadgenerator
context: src/loadgenerator
 steps:
 - name: Checkout source code
 uses: actions/checkout@v4
 - name: Set lowercase owner
 id: owner
 shell: bash
 run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
 - name: Set up Docker Buildx
 uses: docker/setup-buildx-action@v3
 - name: Login to GitHub Container Registry
 uses: docker/login-action@v3
 with:
 registry: ghcr.io
 username: ${{ github.actor }}
 password: ${{ secrets.GITHUB_TOKEN }}
 - name: Build and push ${{ matrix.service }}
 uses: docker/build-push-action@v6
 with:
 context: ${{ matrix.context }}
 push: true
 platforms: linux/amd64
 tags: |
 ghcr.io/${{ steps.owner.outputs.name }}/${{ matrix.service }}:latest
 ghcr.io/${{ steps.owner.outputs.name }}/${{ matrix.service }}:${{ github.sha }}
 cache-from: type=gha
 cache-to: type=gha,mode=max
